name: Build EP seat projections

on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23
  workflow_dispatch:        # "Run workflow" button for an immediate rebuild
  push:
    branches: [main]

permissions:
  contents: write   # to commit the data snapshots
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the seat projection sheets
        env:
          SEATS_PARTY_TSV_URL: ${{ secrets.SEATS_PARTY_TSV_URL }}
          SEATS_EU_TSV_URL: ${{ secrets.SEATS_EU_TSV_URL }}
        run: |
          if [ -z "$SEATS_PARTY_TSV_URL" ] || [ -z "$SEATS_EU_TSV_URL" ]; then
            echo "::error::Add the SEATS_PARTY_TSV_URL and SEATS_EU_TSV_URL repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsSL --retry 3 "$SEATS_PARTY_TSV_URL" -o /tmp/seats_party.tsv
          head -c 300 /tmp/seats_party.tsv | grep -q "EU Parliament group" || {
            echo "::error::SEATS_PARTY_TSV_URL is not the per-party seat sheet (check the link and that the sheet is shared)."; exit 1; }
          curl -fsSL --retry 3 "$SEATS_EU_TSV_URL" -o /tmp/seats_eu.tsv
          head -c 300 /tmp/seats_eu.tsv | grep -q "EPP" || {
            echo "::error::SEATS_EU_TSV_URL is not the EU-wide seat sheet (check the link and that the sheet is shared)."; exit 1; }
          mkdir -p data
          mv /tmp/seats_party.tsv data/seats_party.tsv
          mv /tmp/seats_eu.tsv data/seats_eu.tsv

      - name: Build the page
        run: |
          mkdir -p site
          python scripts/build_seats.py data/seats_party.tsv scripts/europe_map.json site/index.html scripts/seats_template.html data/seats_eu.tsv

      - name: Save a snapshot of the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/seats_party.tsv data/seats_eu.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Data snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
