name: Build EP seat projections

on:
  schedule:
    - cron: "23 * * * *"   # every hour at :23
  workflow_dispatch:        # "Run workflow" button for an immediate rebuild
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/659866385408/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ee-sheets-reader@project-6c08a079-4a01-46eb-aaf.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false

      - name: Read the seat projection Sheets
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
          PROJECTION_SHEET_ID: ${{ secrets.PROJECTION_SHEET_ID }}
          HEADLINE_SHEET_ID: ${{ secrets.HEADLINE_SHEET_ID }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
        run: python3 scripts/fetch_sheets.py

      - name: Build the page
        run: |
          mkdir -p site
          python scripts/build_seats.py data/seats_party.tsv scripts/europe_map.json site/index.html scripts/seats_template.html data/seats_eu.tsv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
